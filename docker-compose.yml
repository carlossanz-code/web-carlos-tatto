services:
  db:
    image: mariadb:11.8
    container_name: nc-db-carlos
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: nextcloud
    container_name: nc-app-carlos
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      NEXTCLOUD_ADMIN_USER: admin-carlostatto
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 10.20.7.16"
    volumes:
      - nextcloud_data:/var/www/html

volumes:
  db_data:
  nextcloud_data:
